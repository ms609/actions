name: Reverse dependency check
description: run revdepcheck::revdep_check(), passing when there are no reverse dependencies
inputs:
    deps:
      description: Dependencies to check, used as "dependencies" parameter in "revdep_check()".
      required: false
      default: 'c("Depends", "Imports", "Suggests", "LinkingTo")'
    extra-packages:
      description: Extra packages to install with r-lib/actions/setup-r-dependencies#
      required: false
      default: ""
    allow-errors:
      description: >
        Comma-separated reverse dependencies whose missing-dependency or
        missing-library errors are tolerated when they also occur against the
        CRAN release (e.g. a Suggests that cannot be installed on Linux).
        Other errors shared by both versions never fail the job; new errors,
        and checks that fail to complete, always do.
      required: false
      default: ""

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: ${{ inputs.extra-packages }}
    
    - name: Install revdepcheck
      run: |
        pak::pkg_install("r-lib/revdepcheck")
      shell: Rscript {0}

    - name: Check reverse dependencies - ${{ inputs.deps }}
      env:
        _R_CHECK_CRAN_INCOMING_REMOTE_: false
        ## setup-r exports NOT_CRAN=true, which revdep checks inherit. Check
        ## revdeps as CRAN will, so that tests they skip on CRAN (vdiffr
        ## snapshots, slow tests) don't report failures CRAN would never see.
        NOT_CRAN: false
        ## Pass deps via the environment, NOT by interpolating into the R
        ## source: an empty input must not become a bare `deps <- ` line, which
        ## would swallow the next statement (deps <- pkg <- read.dcf(...)).
        INPUT_DEPS: ${{ inputs.deps }}
        INPUT_ALLOW_ERRORS: ${{ inputs.allow-errors }}
      run: |
        deps_str <- trimws(Sys.getenv("INPUT_DEPS"))
        deps <- if (nzchar(deps_str)) eval(parse(text = deps_str)) else
                  c("Depends", "Imports", "Suggests", "LinkingTo")
        pkg <- read.dcf("DESCRIPTION", fields = "Package")[1, 1]

        ## revdep_check() installs the package's own CRAN release as a baseline
        ## to diff old-vs-new, so it errors for any package not (yet) on CRAN --
        ## even one with zero reverse dependencies. Resolve the revdep list up
        ## front and treat "none" as a pass, only invoking revdep_check() when
        ## there is something to check (in which case the package is on CRAN and
        ## the baseline install succeeds).
        revdeps <- tryCatch(
          revdepcheck::cran_revdeps(pkg, dependencies = deps),
          error = function(e) {
            db <- suppressWarnings(available.packages())
            tools::package_dependencies(pkg, db = db, which = deps,
                                        reverse = TRUE)[[pkg]]
          }
        )
        revdeps <- setdiff(revdeps, pkg)

        if (length(revdeps) == 0) {
          message("No reverse dependencies (", paste(deps, collapse = ", "),
                  ") for '", pkg, "'; nothing to check.")
        } else {
          ## Binaries from P3M still need their system libraries at run time
          ## (e.g. magick -> libMagick++), and source installs need headers.
          ## Runner images don't promise these, so install whatever the
          ## revdeps and their dependencies declare. A failure here is left
          ## for the checks to surface.
          if (Sys.info()[["sysname"]] == "Linux") tryCatch({
            ## Let pak solve each revdep's full dependency tree, as
            ## revdepcheck will install it. A solve fails outright if any
            ## Suggests is unavailable (e.g. a package off CRAN), so then
            ## list that revdep's dependencies from the repository indexes
            ## instead. Read source indexes (P3M binary indexes can omit
            ## dependency fields), including Bioconductor's.
            repos <- sub("/__linux__/[^/]+/", "/", pak::repo_get()$url)
            db <- suppressWarnings(available.packages(repos = repos))
            ListDeps <- function(pkgs) {
              direct <- unlist(tools::package_dependencies(pkgs, db = db,
                                                           which = "all"))
              needed <- unique(c(pkgs, direct))
              needed <- unique(c(needed, unlist(tools::package_dependencies(
                needed, db = db, recursive = TRUE))))
              intersect(needed, rownames(db))
            }
            SysreqsOf <- function(pkg) tryCatch(
              pak::pkg_sysreqs(pkg, dependencies = TRUE),
              error = function(e) {
                message("Listing dependencies of ", pkg, " (",
                        conditionMessage(e), ")")
                pak::pkg_sysreqs(ListDeps(pkg), dependencies = FALSE)
              })
            cmds <- character(0)
            for (revdep in revdeps) {
              sysreqs <- SysreqsOf(revdep)
              cmds <- c(cmds, sysreqs$pre_install, sysreqs$install_scripts,
                        sysreqs$post_install)
            }
            sudo <- if (Sys.info()[["effective_user"]] == "root") "" else "sudo "
            for (cmd in unique(cmds[nzchar(cmds)])) {
              message("+ ", cmd)
              if (system(paste0(sudo, cmd)) != 0) warning("Failed: ", cmd)
            }
          }, error = function(e) warning("System requirements not installed: ",
                                         conditionMessage(e)))

          ## setup-r points CRAN at Posit Package Manager's Linux *binary*
          ## repo. revdepcheck downloads the revdeps it checks from the same
          ## repos it installs their dependencies from, so it fetches
          ## binaries and every check stops at "Only *source* packages can
          ## be checked" -- identically for both versions, so no revdep
          ## looks broken (r-lib/revdepcheck#407). Keep binary installs,
          ## but download from the same P3M snapshot's source URL.
          ns <- asNamespace("revdepcheck")
          download_opts <- get("download_opts", ns)
          patched <- function(...) {
            opts <- download_opts(...)
            stopifnot(!is.null(opts$args$repos))
            opts$args$repos <- sub("/__linux__/[^/]+/", "/", opts$args$repos)
            opts
          }
          utils::assignInNamespace("download_opts", patched, "revdepcheck")

          ## revdepcheck parses a check once its output closes, which can be
          ## a moment before the process exits; parsing then fails ("Process
          ## still alive") and a passing check is reported as incomplete.
          ## Wait for the exit first.
          checkDone <- get("check_done", ns)
          utils::assignInNamespace("check_done", function(state, worker) {
            worker$process$wait(timeout = 60000)
            checkDone(state, worker)
          }, "revdepcheck")

          RunChecks <- function() {
            revdepcheck::revdep_check(timeout = as.difftime(60, units = 'mins'),
                                      num_workers = 3,
                                      dependencies = deps)
          }
          RunChecks()

          ## Errors that mean the check never exercised the revdep: a
          ## dependency or system library missing from this runner. These
          ## would repeat against both versions and hide any regression.
          envPattern <- paste(c(
            "there is no package called",
            "[Pp]ackages? required but not available",
            "unable to load shared object",
            "cannot open shared object file",
            "Only \\*source\\* packages can be checked",
            "can be installed \\.\\.\\. ERROR"
          ), collapse = "|")
          EnvErrors <- function(res) {
            errs <- if (inherits(res$new, "rcmdcheck")) res$new$errors
            errs[grepl(envPattern, errs)]
          }

          ## Re-check, once, any revdep whose check could not start (e.g. a
          ## dependency download that P3M answered with HTTP 500) or hit
          ## a missing library -- after installing the system requirements
          ## of everything revdepcheck installed, which can include packages
          ## the solve above did not foresee.
          ## (Timeouts, status "t...", are not retried.)
          retry <- names(Filter(function(res) {
            incomplete <- !res$status %in% c("+", "-") &&
              !startsWith(res$status, "t")
            incomplete || length(EnvErrors(res)) > 0
          }, revdepcheck::revdep_summary()))
          if (length(retry)) {
            if (Sys.info()[["sysname"]] == "Linux") {
              libs <- unique(dirname(dirname(list.files(
                "revdep/library", pattern = "^DESCRIPTION$", recursive = TRUE,
                full.names = TRUE))))
              for (lib in libs) tryCatch(
                pak::sysreqs_fix_installed(library = lib),
                error = function(e) warning("System requirements of ", lib,
                                            " not installed: ",
                                            conditionMessage(e)))
            }
            message("Retrying: ", paste(retry, collapse = ", "))
            revdepcheck::revdep_add(".", retry)
            RunChecks()
          }

          ## problems.md only lists *new* problems, so on its own it passes
          ## when a check fails to run (failures.md) or when a missing
          ## dependency stops every revdep identically against both the CRAN
          ## and the dev version -- which is what a broken check environment
          ## looks like. Gate on the results themselves. Other errors that
          ## both versions share are the revdep's own, and only annotated.
          allowed <- trimws(strsplit(Sys.getenv("INPUT_ALLOW_ERRORS"), ",")[[1]])
          bad <- character(0)
          for (res in revdepcheck::revdep_summary()) {
            name <- res$package
            status <- res$status
            errs <- if (inherits(res$new, "rcmdcheck")) res$new$errors else character(0)
            if (status == "-") {
              bad <- c(bad, sprintf("%s: new problems (see problems.md)", name))
            } else if (status != "+") {
              bad <- c(bad, sprintf("%s: check did not complete (status '%s'; see failures.md)",
                                    name, status))
            } else if (length(EnvErrors(res)) && !name %in% allowed) {
              bad <- c(bad, sprintf("%s: missing dependency or system library (in both versions)",
                                    name))
            } else if (length(errs)) {
              cat(sprintf("::warning::%s: %d error(s) also occur against the CRAN release\n",
                          name, length(errs)))
            }
            if (length(errs)) {
              cat(sprintf("::group::%s: R CMD check errors (dev version)\n", name))
              cat(errs, sep = "\n\n")
              cat("\n::endgroup::\n")
            }
          }
          ## An incomplete check's install or timeout error is only in
          ## failures.md; print it so the log says why without the artifact.
          if (any(grepl("did not complete", bad)) && file.exists("revdep/failures.md")) {
            cat("::group::revdep/failures.md\n")
            writeLines(readLines("revdep/failures.md", warn = FALSE))
            cat("::endgroup::\n")
            ## failures.md omits why a check result could not be read.
            for (item in grep("did not complete", bad, value = TRUE)) {
              name <- sub(":.*", "", item)
              rows <- revdepcheck:::db_get_results(".", name)
              for (which in c("old", "new")) {
                row <- rows[[which]]
                cat(sprintf("::group::%s (%s): stored status %s\n", name, which,
                            if (nrow(row)) row$status else "none"))
                if (nrow(row)) cat(substr(row$result, 1, 3000), "\n")
                cat("::endgroup::\n")
              }
            }
          }
          if (length(bad)) {
            stop("Reverse dependency check failed:\n  ",
                 paste(bad, collapse = "\n  "), call. = FALSE)
          }
        }
      shell: Rscript {0}

    - name: Name results artifact
      id: artifact
      if: always()
      env:
        INPUT_DEPS: ${{ inputs.deps }}
      run: |
        # One artifact per matrix leg: upload-artifact refuses duplicate names.
        slug=$(printf '%s' "$INPUT_DEPS" | tr -c 'A-Za-z0-9' '-' | tr -s '-' | sed 's/^-//;s/-$//')
        echo "name=revdep-results${slug:+-$slug}" >> "$GITHUB_OUTPUT"
      shell: bash

    # Always upload: a green job can still hide errors worth reading.
    - name: Upload check results
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: revdep/*.md
        if-no-files-found: ignore

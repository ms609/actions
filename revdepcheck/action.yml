name: Reverse dependency check
description: run revdepcheck::revdep_check(), passing when there are no reverse dependencies
inputs:
    deps:
      description: Dependencies to check, used as "dependencies" parameter in "revdep_check()".
      required: false
      default: 'c("Depends", "Imports", "Suggests", "LinkingTo")'
    extra-packages:
      description: Extra packages to install with r-lib/actions/setup-r-dependencies#
      required: false
      default: ""
    allow-errors:
      description: >
        Comma-separated reverse dependencies whose R CMD check errors are
        tolerated when the same errors occur against the CRAN release (e.g. a
        revdep that is currently broken on CRAN for reasons of its own).
        New errors, and checks that fail to complete, still fail the job.
      required: false
      default: ""

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@v6

    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: release
        use-public-rspm: true

    - uses: r-lib/actions/setup-pandoc@v2

    - uses: r-lib/actions/setup-r-dependencies@v2
      with:
        extra-packages: ${{ inputs.extra-packages }}
    
    - name: Install revdepcheck
      run: |
        pak::pkg_install("r-lib/revdepcheck")
      shell: Rscript {0}

    - name: Check reverse dependencies - ${{ inputs.deps }}
      env:
        _R_CHECK_CRAN_INCOMING_REMOTE_: false
        ## setup-r exports NOT_CRAN=true, which revdep checks inherit. Check
        ## revdeps as CRAN will, so that tests they skip on CRAN (vdiffr
        ## snapshots, slow tests) don't report failures CRAN would never see.
        NOT_CRAN: false
        ## Pass deps via the environment, NOT by interpolating into the R
        ## source: an empty input must not become a bare `deps <- ` line, which
        ## would swallow the next statement (deps <- pkg <- read.dcf(...)).
        INPUT_DEPS: ${{ inputs.deps }}
        INPUT_ALLOW_ERRORS: ${{ inputs.allow-errors }}
      run: |
        deps_str <- trimws(Sys.getenv("INPUT_DEPS"))
        deps <- if (nzchar(deps_str)) eval(parse(text = deps_str)) else
                  c("Depends", "Imports", "Suggests", "LinkingTo")
        pkg <- read.dcf("DESCRIPTION", fields = "Package")[1, 1]

        ## revdep_check() installs the package's own CRAN release as a baseline
        ## to diff old-vs-new, so it errors for any package not (yet) on CRAN --
        ## even one with zero reverse dependencies. Resolve the revdep list up
        ## front and treat "none" as a pass, only invoking revdep_check() when
        ## there is something to check (in which case the package is on CRAN and
        ## the baseline install succeeds).
        revdeps <- tryCatch(
          revdepcheck::cran_revdeps(pkg, dependencies = deps),
          error = function(e) {
            db <- suppressWarnings(available.packages())
            tools::package_dependencies(pkg, db = db, which = deps,
                                        reverse = TRUE)[[pkg]]
          }
        )
        revdeps <- setdiff(revdeps, pkg)

        if (length(revdeps) == 0) {
          message("No reverse dependencies (", paste(deps, collapse = ", "),
                  ") for '", pkg, "'; nothing to check.")
        } else {
          ## Binaries from P3M still need their system libraries at run time
          ## (e.g. magick -> libMagick++), and source installs need headers.
          ## Runner images don't promise these, so install whatever the
          ## revdeps and their dependencies declare. A failure here is left
          ## for the checks to surface.
          if (Sys.info()[["sysname"]] == "Linux") tryCatch({
            ## List the packages ourselves rather than letting pak solve the
            ## graph: one unresolvable Suggests (e.g. a package off CRAN)
            ## would sink the whole solve.
            cran <- suppressWarnings(available.packages())
            needed <- unique(c(revdeps, unlist(tools::package_dependencies(
              revdeps, db = cran, which = "all"))))
            needed <- unique(c(needed, unlist(tools::package_dependencies(
              needed, db = cran, recursive = TRUE))))
            needed <- intersect(needed, rownames(cran))
            sysreqs <- pak::pkg_sysreqs(needed, dependencies = FALSE)
            sudo <- if (Sys.info()[["effective_user"]] == "root") "" else "sudo "
            for (cmd in c(sysreqs$pre_install, sysreqs$install_scripts,
                          sysreqs$post_install)) {
              if (!nzchar(cmd)) next
              message("+ ", cmd)
              if (system(paste0(sudo, cmd)) != 0) warning("Failed: ", cmd)
            }
          }, error = function(e) warning("System requirements not installed: ",
                                         conditionMessage(e)))

          ## setup-r points CRAN at Posit Package Manager's Linux *binary*
          ## repo. revdepcheck downloads the revdeps it checks from the same
          ## repos it installs their dependencies from, so it fetches
          ## binaries and every check stops at "Only *source* packages can
          ## be checked" -- identically for both versions, so no revdep
          ## looks broken (r-lib/revdepcheck#407). Keep binary installs,
          ## but download from the same P3M snapshot's source URL.
          ns <- asNamespace("revdepcheck")
          download_opts <- get("download_opts", ns)
          patched <- function(...) {
            opts <- download_opts(...)
            stopifnot(!is.null(opts$args$repos))
            opts$args$repos <- sub("/__linux__/[^/]+/", "/", opts$args$repos)
            opts
          }
          utils::assignInNamespace("download_opts", patched, "revdepcheck")

          revdepcheck::revdep_check(timeout = as.difftime(60, units = 'mins'),
                                    num_workers = 3,
                                    dependencies = deps)

          ## problems.md only lists *new* problems, so on its own it passes
          ## when a check fails to run (failures.md) or when every revdep
          ## errors identically against both the CRAN and the dev version --
          ## which is what a broken check environment looks like. Gate on
          ## the results themselves.
          allowed <- trimws(strsplit(Sys.getenv("INPUT_ALLOW_ERRORS"), ",")[[1]])
          bad <- character(0)
          for (res in revdepcheck::revdep_summary()) {
            name <- res$package
            status <- res$status
            errs <- if (inherits(res$new, "rcmdcheck")) res$new$errors else character(0)
            if (status == "-") {
              bad <- c(bad, sprintf("%s: new problems (see problems.md)", name))
            } else if (status != "+") {
              bad <- c(bad, sprintf("%s: check did not complete (status '%s'; see failures.md)",
                                    name, status))
            } else if (length(errs) && !name %in% allowed) {
              bad <- c(bad, sprintf("%s: %d error(s) against both CRAN and dev versions",
                                    name, length(errs)))
            }
            if (length(errs)) {
              cat(sprintf("::group::%s: R CMD check errors (dev version)\n", name))
              cat(errs, sep = "\n\n")
              cat("\n::endgroup::\n")
            }
          }
          if (length(bad)) {
            stop("Reverse dependency check failed:\n  ",
                 paste(bad, collapse = "\n  "), call. = FALSE)
          }
        }
      shell: Rscript {0}

    - name: Name results artifact
      id: artifact
      if: always()
      env:
        INPUT_DEPS: ${{ inputs.deps }}
      run: |
        # One artifact per matrix leg: upload-artifact refuses duplicate names.
        slug=$(printf '%s' "$INPUT_DEPS" | tr -c 'A-Za-z0-9' '-' | tr -s '-' | sed 's/^-//;s/-$//')
        echo "name=revdep-results${slug:+-$slug}" >> "$GITHUB_OUTPUT"
      shell: bash

    # Always upload: a green job can still hide errors worth reading.
    - name: Upload check results
      if: always()
      uses: actions/upload-artifact@main
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: revdep/*.md
        if-no-files-found: ignore

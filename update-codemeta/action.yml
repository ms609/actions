name: Update codemeta
description: >
  Regenerate codemeta.json on a pull request; if it is stale, push the update
  to the PR branch and fail, so later jobs wait for the fresh run.
inputs:
  client-id:
    description: Client ID of the GitHub App that pushes the update (e.g. vars.CODEMETA_APP_ID).
    required: false
    default: ''
  private-key:
    description: Private key of that App (e.g. secrets.CODEMETA_APP_KEY).
    required: false
    default: ''
outputs:
  pushed:
    description: >
      'true' if an update was pushed, starting a fresh run; jobs that need not
      finish on the superseded commit can then skip.
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    - name: Checkout PR branch
      uses: actions/checkout@v6
      with:
        ref: ${{ github.head_ref }}
        persist-credentials: false  # push with the app token, not GITHUB_TOKEN

    - name: Build metadata
      id: build
      shell: bash
      run: |
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          echo "::error::update-codemeta runs on pull_request events only."
          exit 1
        fi
        python3 "$GITHUB_ACTION_PATH/codemeta.py"
        if git diff --quiet -- codemeta.json; then
          echo "codemeta.json is up to date."
        else
          git diff -- codemeta.json
          echo "stale=true" >> "$GITHUB_OUTPUT"
        fi

    # GITHUB_TOKEN pushes start no workflow runs, which would leave the PR
    # without checks; an App token's push starts a fresh run.
    - name: Mint app token
      id: app
      if: steps.build.outputs.stale == 'true' && inputs.private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write

    - name: Push metadata
      id: push
      if: steps.build.outputs.stale == 'true'
      shell: bash
      env:
        TOKEN: ${{ steps.app.outputs.token }}
        APP: ${{ steps.app.outputs.app-slug }}
        BRANCH: ${{ github.head_ref }}
      run: |
        fix="Apply the diff above to codemeta.json (or run python3 codemeta.py from ms609/actions/update-codemeta) and commit it."
        if [ -z "$TOKEN" ]; then
          echo "::error::codemeta.json is stale and no app key is available (fork or Dependabot PR?). $fix"
          exit 1
        fi
        uid=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.github.com/users/${APP}%5Bbot%5D" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
        git config --local user.name "${APP}[bot]"
        git config --local user.email "${uid}+${APP}[bot]@users.noreply.github.com"
        git add codemeta.json
        git commit -m "Update codemeta.json"
        if ! git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"; then
          echo "::error::codemeta.json is stale and could not be pushed (the branch may have moved). $fix"
          exit 1
        fi
        echo "pushed=true" >> "$GITHUB_OUTPUT"

    - name: Report push
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: |
        echo "::error::codemeta.json was stale; pushed an update, which starts a fresh run."
        exit 1

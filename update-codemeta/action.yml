name: Update codemeta
description: >
  Regenerate codemeta.json on a pull request; if it is stale, push the update
  to the PR branch and fail, so later jobs wait for the fresh run.
inputs:
  client-id:
    description: Client ID of the GitHub App that pushes the update (e.g. vars.CODEMETA_APP_ID).
    required: false
    default: ''
  private-key:
    description: Private key of that App (e.g. secrets.CODEMETA_APP_KEY).
    required: false
    default: ''
outputs:
  pushed:
    description: >
      'true' if an update was pushed, starting a fresh run; jobs that need not
      finish on the superseded commit can then skip.
    value: ${{ steps.push.outputs.pushed }}

runs:
  using: composite
  steps:
    # codemeta.json is maintained in the home repository only. In a fork (e.g.
    # an agent's working copy) the job is a no-op; a PR from a fork into the
    # home repository can't be pushed to, so staleness there is only reported,
    # and the next same-repository PR brings the file up to date.
    - name: Scope
      id: scope
      shell: bash
      env:
        FORK: ${{ github.event.repository.fork }}
        HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
          echo "::error::update-codemeta runs on pull_request events only."
          exit 1
        elif [ "$FORK" = true ]; then
          echo "::notice::$GITHUB_REPOSITORY is a fork; codemeta.json is updated in the home repository."
        elif [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
          echo "mode=report" >> "$GITHUB_OUTPUT"
        else
          echo "mode=update" >> "$GITHUB_OUTPUT"
        fi

    - name: Checkout PR head
      if: steps.scope.outputs.mode != ''
      uses: actions/checkout@v6
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        persist-credentials: false  # push with the app token, not GITHUB_TOKEN

    - name: Build metadata
      id: build
      if: steps.scope.outputs.mode != ''
      shell: bash
      env:
        MODE: ${{ steps.scope.outputs.mode }}
      run: |
        python3 "$GITHUB_ACTION_PATH/codemeta.py"
        if git diff --quiet -- codemeta.json; then
          echo "codemeta.json is up to date."
        elif [ "$MODE" = report ]; then
          git diff -- codemeta.json
          echo "::warning::codemeta.json is stale; it will be updated by the next pull request from within $GITHUB_REPOSITORY."
        else
          git diff -- codemeta.json
          echo "stale=true" >> "$GITHUB_OUTPUT"
        fi

    # GITHUB_TOKEN pushes start no workflow runs, which would leave the PR
    # without checks; an App token's push starts a fresh run.
    - name: Mint app token
      id: app
      if: steps.build.outputs.stale == 'true' && inputs.private-key != ''
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write

    - name: Push metadata
      id: push
      if: steps.build.outputs.stale == 'true'
      shell: bash
      env:
        TOKEN: ${{ steps.app.outputs.token }}
        APP: ${{ steps.app.outputs.app-slug }}
        BRANCH: ${{ github.head_ref }}
      run: |
        fix="Apply the diff above to codemeta.json (or run python3 codemeta.py from ms609/actions/update-codemeta) and commit it."
        if [ -z "$TOKEN" ]; then
          echo "::error::codemeta.json is stale and no app key is available (Dependabot PR?). $fix"
          exit 1
        fi
        uid=$(curl -fsS -H "Authorization: Bearer $TOKEN" "https://api.github.com/users/${APP}%5Bbot%5D" | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')
        git config --local user.name "${APP}[bot]"
        git config --local user.email "${uid}+${APP}[bot]@users.noreply.github.com"
        git add codemeta.json
        git commit -m "Update codemeta.json"
        # A freshly minted token can be refused (403) for a few seconds while it
        # propagates, so retry that; a rejected push (branch moved) is final.
        for wait in 5 10 20 0; do
          if out=$(git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}" 2>&1); then
            echo "$out"
            echo "pushed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$out"
          if [ "$wait" = 0 ] || ! grep -qE "error: 40[13]|denied" <<< "$out"; then
            break
          fi
          echo "Retrying in ${wait} s."
          sleep "$wait"
        done
        echo "::error::codemeta.json is stale and could not be pushed (see above). $fix"
        exit 1

    - name: Report push
      if: steps.push.outputs.pushed == 'true'
      shell: bash
      run: |
        echo "::error::codemeta.json was stale; pushed an update, which starts a fresh run."
        exit 1
